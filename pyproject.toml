[project]
name = "clinic-assistant"
version = "0.1.0"
description = "Family Clinic Assistant: a RAG reference app for the Applied AI Engineer Bootcamp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "supabase>=2.33.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: calls real Supabase and Voyage; needs a filled-in .env"]
addopts = "-m 'not integration'"
